---
name: Build/Push/Deploy Container Image
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - stage
          - prod
        default: stage
      image_tag:
        description: >-
          Full image tag to deploy (leave empty for auto-tagged
          {stage|prod}-<full-sha> — to roll back, pass a complete tag
          from a prior deploy, e.g. stage-<full-40-char-sha>)
        required: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Image Tag
        id: meta
        env:
          TARGET_ENV: ${{ inputs.environment }}
          INPUT_TAG: ${{ inputs.image_tag }}
          STAGING_WORKFLOW_ID: ${{ secrets.GH_TRIGGER_WORKFLOW_ID_STAGING }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREFIX=prod
          if [ "$TARGET_ENV" = "stage" ]; then
            PREFIX=stage
            [ -n "$STAGING_WORKFLOW_ID" ] || { echo "GH_TRIGGER_WORKFLOW_ID_STAGING is not set"; exit 1; }
          fi
          TAG="${INPUT_TAG:-$PREFIX-$GITHUB_SHA}"
          [[ "$TAG" =~ ^$PREFIX-[0-9a-f]{40}$ ]] || { echo "Invalid image tag: $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$INPUT_TAG" ]; then
            echo "rollback=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Code
        if: steps.meta.outputs.rollback != 'true'
        uses: actions/checkout@v4.2.2

      - name: Configure Credentials
        if: steps.meta.outputs.rollback != 'true'
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to AWS ECR
        if: steps.meta.outputs.rollback != 'true'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Build and Push Docker Image
        if: steps.meta.outputs.rollback != 'true'
        uses: docker/build-push-action@v6.14.0
        with:
          context: .
          build-args: |
            UID=${{ secrets.APP_USER_UID }}
            GID=${{ secrets.APP_USER_GID }}
          target: app
          push: true
          tags: ${{ secrets.CONTAINER_IMAGE_REPO }}/session-portal-backend:${{ steps.meta.outputs.tag }}${{ github.event_name == 'release' && format(', {0}/session-portal-backend:latest', secrets.CONTAINER_IMAGE_REPO) || '' }}

      - name: Create Temporary Deployment Token
        uses: actions/create-github-app-token@v2.0.6
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}
          owner: ${{ secrets.GH_TRIGGER_OWNER }}
          repositories: |
            ${{ secrets.GH_TRIGGER_REPO }}

      - name: Trigger Backend Deployment
        uses: actions/github-script@v7.0.1
        env:
          OWNER: ${{ secrets.GH_TRIGGER_OWNER }}
          REPO: ${{ secrets.GH_TRIGGER_REPO }}
          WORKFLOW_ID: ${{ inputs.environment == 'stage' && secrets.GH_TRIGGER_WORKFLOW_ID_STAGING || secrets.GH_TRIGGER_WORKFLOW_ID }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
              await github.rest.actions.createWorkflowDispatch({
                owner: process.env.OWNER,
                repo: process.env.REPO,
                workflow_id: process.env.WORKFLOW_ID,
                ref: 'main',
                inputs: { 'backend_version': '${{ steps.meta.outputs.tag }}' }
              });
