---
name: Build/Push/Deploy Container Image
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - stage
          - prod
        default: stage

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Image Tag
        id: meta
        env:
          TARGET_ENV: ${{ inputs.environment }}
          STAGING_WORKFLOW_ID: ${{ secrets.GH_TRIGGER_WORKFLOW_ID_STAGING }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$TARGET_ENV" = "stage" ] && [ -z "$STAGING_WORKFLOW_ID" ]; then
            echo "GH_TRIGGER_WORKFLOW_ID_STAGING is not set"
            exit 1
          fi
          echo "tag=$TARGET_ENV-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to AWS ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          build-args: |
            UID=${{ secrets.APP_USER_UID }}
            GID=${{ secrets.APP_USER_GID }}
          target: app
          push: true
          tags: ${{ secrets.CONTAINER_IMAGE_REPO }}/session-portal-backend:${{ steps.meta.outputs.tag }}${{ github.event_name == 'release' && format(', {0}/session-portal-backend:latest', secrets.CONTAINER_IMAGE_REPO) || '' }}

      - name: Create Temporary Deployment Token
        uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}
          owner: ${{ secrets.GH_TRIGGER_OWNER }}
          repositories: |
            ${{ secrets.GH_TRIGGER_REPO }}

      - name: Trigger Backend Deployment
        uses: actions/github-script@v7.0.1
        env:
          OWNER: ${{ secrets.GH_TRIGGER_OWNER }}
          REPO: ${{ secrets.GH_TRIGGER_REPO }}
          WORKFLOW_ID: ${{ inputs.environment == 'stage' && secrets.GH_TRIGGER_WORKFLOW_ID_STAGING || secrets.GH_TRIGGER_WORKFLOW_ID }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
              await github.rest.actions.createWorkflowDispatch({
                owner: process.env.OWNER,
                repo: process.env.REPO,
                workflow_id: process.env.WORKFLOW_ID,
                ref: 'main',
                inputs: { 'backend_version': '${{ steps.meta.outputs.tag }}' }
              });
